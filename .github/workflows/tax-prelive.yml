name: Tax Deploy Prelive

on:
  push:
    branches: [main]
    paths:
      - "apps/tax-webapp/**"
      - "packages/tax/**"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".github/workflows/tax-*.yml"

concurrency:
  group: tax-prelive
  cancel-in-progress: true

env:
  WRANGLER_VERSION: "4.127.1"

jobs:
  prelive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build tax-webapp
        working-directory: apps/tax-webapp
        env:
          VITE_API_MODE: live
        run: pnpm exec turbo run build --filter=@excited-live/tax-webapp
      - name: Deploy prelive
        working-directory: apps/tax-webapp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages project create excited-live-tax-prelive --production-branch main || true
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages deploy dist/client --project-name=excited-live-tax-prelive --branch=main --commit-dirty=true
