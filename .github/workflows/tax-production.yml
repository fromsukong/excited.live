name: Tax Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PROD to confirm production deploy"
        required: true
        default: ""

env:
  WRANGLER_VERSION: "4.127.1"

jobs:
  production:
    if: github.event.inputs.confirm == 'PROD'
    runs-on: ubuntu-latest
    steps:
      # Review-gate hardening: workflow_dispatch lets the operator pick any
      # ref in the UI — pin the checkout to main so only main can be built
      # and deployed to the production project, whatever ref was selected.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build tax-webapp
        working-directory: apps/tax-webapp
        env:
          VITE_API_MODE: live
        run: pnpm exec turbo run build --filter=@excited-live/tax-webapp
      - name: Deploy production
        working-directory: apps/tax-webapp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages project create excited-live-tax --production-branch main || true
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages deploy dist/client --project-name=excited-live-tax --branch=main --commit-dirty=true
