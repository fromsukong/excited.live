name: Tax PR Previews

on:
  pull_request:
    paths:
      - "apps/tax-webapp/**"
      - "packages/tax/**"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".github/workflows/tax-*.yml"

concurrency:
  group: tax-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: "4.127.1"

jobs:
  preview-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tax app imports @excited-live/tax, which resolves to
      # packages/tax/dist — turbo builds the dependency chain (^build)
      # before the app itself. A bare in-app `pnpm build` would fail.
      - name: Build tax-webapp (mock)
        working-directory: apps/tax-webapp
        env:
          VITE_API_MODE: mock
        run: pnpm exec turbo run build --filter=@excited-live/tax-webapp
      - name: Deploy mock preview
        working-directory: apps/tax-webapp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Untrusted input: go through env, never inline ${{ }} in the script.
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # NOTE: the PY terminator must land at column 0 after YAML strips
          # this block scalar's indentation — do not re-indent this run block.
          # Sanitize the branch name so the pages.dev alias is always a valid
          # hostname (Cloudflare aliases: lowercase, non-[a-z0-9-] -> '-',
          # trim dashes, max 28 chars). Cut to 23 so '-mock'/'-live' always
          # survives — MUST stay in sync with the other tax-* workflows and
          # the main preview.yml algorithm.
          SANITIZED_BRANCH="$(python3 - <<'PY'
          import os, re
          b = os.environ.get('PR_HEAD_REF', '')
          s = re.sub('[A-Z]', lambda m: m.group(0).lower(), b)
          s = re.sub('[^a-z0-9-]', '-', s).strip('-')[:23].strip('-')
          if not s:
              s = 'branch-' + os.environ.get('PR_HEAD_SHA', '')[:8]
          print(s)
          PY
          )"
          echo "Preview alias base: $SANITIZED_BRANCH"
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages project create excited-live-tax --production-branch main || true
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages deploy dist/client --project-name=excited-live-tax --branch="${SANITIZED_BRANCH}-mock" --commit-dirty=true

  preview-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build tax-webapp (live)
        working-directory: apps/tax-webapp
        env:
          VITE_API_MODE: live
        run: pnpm exec turbo run build --filter=@excited-live/tax-webapp
      - name: Deploy live preview
        working-directory: apps/tax-webapp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Untrusted input: go through env, never inline ${{ }} in the script.
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Same sanitization as the mock job — keep the two in sync.
          SANITIZED_BRANCH="$(python3 - <<'PY'
          import os, re
          b = os.environ.get('PR_HEAD_REF', '')
          s = re.sub('[A-Z]', lambda m: m.group(0).lower(), b)
          s = re.sub('[^a-z0-9-]', '-', s).strip('-')[:23].strip('-')
          if not s:
              s = 'branch-' + os.environ.get('PR_HEAD_SHA', '')[:8]
          print(s)
          PY
          )"
          echo "Preview alias base: $SANITIZED_BRANCH"
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages project create excited-live-tax --production-branch main || true
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages deploy dist/client --project-name=excited-live-tax --branch="${SANITIZED_BRANCH}-live" --commit-dirty=true
