name: Deploy

on:
  push:
    branches: [main]
  pull_request:

env:
  WRANGLER_VERSION: "4.127.1"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build webapp
        run: pnpm --filter @excited-live/webapp build

      - name: Deploy mock preview
        if: github.event_name == 'pull_request'
        working-directory: apps/webapp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages project create excited-live --production-branch main || true
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages deploy dist/client --project-name=excited-live --branch=${{ github.head_ref }}-mock --commit-dirty=true

      - name: Deploy live preview
        if: github.event_name == 'pull_request'
        working-directory: apps/webapp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages project create excited-live --production-branch main || true
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages deploy dist/client --project-name=excited-live --branch=${{ github.head_ref }}-live --commit-dirty=true

      - name: Deploy production
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: apps/webapp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages project create excited-live --production-branch main || true
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages deploy dist/client --project-name=excited-live --branch=main --commit-dirty=true