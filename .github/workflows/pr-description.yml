name: PR Description Update

on:
  workflow_run:
    workflows: ["PR Previews"]
    types: [completed]

jobs:
  update-pr:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Update PR description with preview URLs
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.workflow_run.pull_requests[0]?.number;
            if (!prNumber) { core.info('No PR found for this run'); return; }
            const head = context.payload.workflow_run.head_branch;
            const mockUrl = `https://${head}-mock.excited-live.pages.dev`;
            const liveUrl = `https://${head}-live.excited-live.pages.dev`;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            let body = pr.body || '';
            const markerStart = '<!-- AUTO-PREVIEWS:START -->';
            const markerEnd = '<!-- AUTO-PREVIEWS:END -->';
            const block = [
              markerStart,
              '### 🌐 Live previews (auto-updated)',
              '- **Mock**: ' + mockUrl,
              '- **Live**: ' + liveUrl,
              markerEnd,
            ].join('\n');
            if (body.includes(markerStart)) {
              body = body.replace(new RegExp(markerStart + '[\\s\\S]*?' + markerEnd), block);
            } else {
              body = body + '\n\n' + block;
            }
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              body: body,
            });
            core.info('Updated PR #' + prNumber + ' with preview URLs');
